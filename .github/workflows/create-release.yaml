name: Create Release


on:
  push:
    tags:
      - '*.*.*'


env:
  SOURCE_DIR:   ${{github.workspace}}
  PROG:         cubiomes-viewer


jobs:

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          version:      '6.11.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          archives: 'qtbase qttools'
          cache: true
          setup-python: false
          tools: 'tools_mingw1310'
      - name: Build
        working-directory: ${{env.SOURCE_DIR}}
        env:
          CMAKE_GENERATOR: MinGW Makefiles
          CC: gcc
          CXX: g++
        run:  |
              qmake6 CONFIG+=release ${{env.SOURCE_DIR}}
              mingw32-make

      - name: Deploy
        working-directory: ${{env.SOURCE_DIR}}
        run:  |
              mkdir ${{env.PROG}}
              copy ${{env.SOURCE_DIR}}\release\${{env.PROG}}.exe ${{env.PROG}}
              windeployqt6 --dir ${{env.PROG}} ${{env.SOURCE_DIR}}\release\${{env.PROG}}.exe --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw
              ${{env.SOURCE_DIR}}\${{env.PROG}}\${{env.PROG}}.exe --version

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.PROG}}-win
          path: ${{env.SOURCE_DIR}}\${{env.PROG}}


  build-macos:
      runs-on: macos-latest

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4
          with:
            submodules: recursive

        - name: Install Qt
          uses: jurplel/install-qt-action@v4
          with:
            aqtversion:   '==3.1.*'
            version:      '6.11.2'
            archives:     'x86_64 arm64 qtbase qttools'
            cache:        true

        - name: Build
          working-directory: ${{env.SOURCE_DIR}}
          run:  |
                qmake CONFIG+=release ${{env.SOURCE_DIR}}
                CFLAGS="-isysroot /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" make

        - name: Deploy
          working-directory: ${{env.SOURCE_DIR}}
          run:  |
                macdeployqt ${{env.PROG}}.app -dmg

        - name: Test
          working-directory: ${{env.SOURCE_DIR}}
          run:  |
                ./${{env.PROG}}.app/Contents/MacOS/${{env.PROG}} --version
                otool -L ${{env.PROG}}.app/Contents/MacOS/${{env.PROG}}

        - name: Save build artifact
          uses: actions/upload-artifact@v4
          with:
            name: ${{env.PROG}}-macos
            path: ${{env.SOURCE_DIR}}/${{env.PROG}}.dmg

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Obtain necessary packages
        run: sudo apt install -y build-essential qt6-base-dev qtchooser qmake6 qt6-base-dev-tools
    
      - name: Build
        working-directory: ${{env.SOURCE_DIR}}
        run: mkdir build && cd build && qmake6 .. && make
      
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.PROG}}-linux
          path: ${{env.SOURCE_DIR}}/build/cubiomes-viewer

  create_release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts from previous jobs 
        uses: actions/download-artifact@v8
        with:
          skip-decompress: true
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{secrets.RELEASE_TOKEN}}
          files: release-artifacts/*
          generate_release_notes: true

