name: macOS Release

on:
  push:
    branches:
      - 'trunk'
    tags:
      - 'v*'

  pull_request:
    branches:
      - 'trunk'
env:
  PROG:         cubiomes-viewer
  SOURCE_DIR:   ${{github.workspace}}

jobs:
  build-macos:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup python venv
        run: |
            python3 -m venv .venv
            echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion:   '==3.1.*'
          version:      '6.11.2'
          archives:     'x86_64 arm64 qtbase qttools'
          cache:        true
          setup-python: false

      - name: Build
        working-directory: ${{env.SOURCE_DIR}}
        run:  |
              qmake CONFIG+=release ${{env.SOURCE_DIR}}
              CFLAGS="-isysroot /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" make

      - name: Deploy
        working-directory: ${{env.SOURCE_DIR}}
        run:  |
              macdeployqt ${{env.PROG}}.app -dmg

      - name: Test
        working-directory: ${{env.SOURCE_DIR}}
        run:  |
              ./${{env.PROG}}.app/Contents/MacOS/${{env.PROG}} --version
              otool -L ${{env.PROG}}.app/Contents/MacOS/${{env.PROG}}

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.PROG}}-macos
          path: ${{env.SOURCE_DIR}}/${{env.PROG}}.dmg

