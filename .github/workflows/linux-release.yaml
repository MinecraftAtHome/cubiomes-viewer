name: Linux Release

on:
  push:
    branches:
      - 'trunk'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'trunk'

defaults:
  run:
    shell: bash


env:
  PROG: cubiomes-viewer
  SOURCE_DIR: ${{github.workspace}}


jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Obtain necessary packages
        run: sudo apt install -y build-essential icu

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          version:      '6.11.2'
          host: 'linux'
          target: 'desktop'
          archives: 'qtbase qttools'
          cache: true
          setup-python: true
      - name: Build
        working-directory: ${{env.SOURCE_DIR}}
        run: mkdir build && cd build && qmake6 .. && make
      
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.PROG}}-linux
          path: ${{env.SOURCE_DIR}}/build/cubiomes-viewer
